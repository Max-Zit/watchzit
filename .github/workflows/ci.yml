name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run (fewer runs, and
# one e-mail per push at most: the security checks are a job here too).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)" || (gofmt -l ./cmd ./internal ./tools; exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 -timeout 20m ./...
      - name: Agent for ARM64
        env:
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/watchzit-agent

  security:
    name: Security checks (staticcheck, gosec, govulncheck, gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet for Windows
        run: GOOS=windows go vet ./...
      - name: staticcheck (Linux and Windows)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
          GOOS=windows staticcheck ./...
      - name: gosec (Linux and Windows)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -quiet ./...
          GOOS=windows gosec -quiet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -format json ./... | go run ./tools/vulngate .govulncheck-accepted
      - name: gitleaks (secrets in the history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner .

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch the test PostgreSQL once (parallel test binaries would all download it)
        run: go test -race -count=1 ./internal/tsdb
      - name: Tests with -race
        run: go test -race -count=1 -timeout 40m ./...

  fuzz:
    name: Fuzz parsers of untrusted input (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each target for 20 s
        run: |
          set -e
          for t in launch:FuzzParse agent:FuzzParseEnrollCode datasource:FuzzParseJSONSeries netacl:FuzzParse \
                   web:FuzzParseState web:FuzzParseIDPMetadata web:FuzzFormLists web:FuzzCheckSAMLResponse store:FuzzParseSteps \
                   checks:FuzzNTLMChallenge checks:FuzzWSItems checks:FuzzParseLinux \
                   flow:FuzzDecode snmp:FuzzDecode snmp:FuzzParseTrap logrecv:FuzzParseSyslog tsdb:FuzzDecode; do
            go test "./internal/${t%%:*}" -run '^$' -fuzz "^${t##*:}\$" -fuzztime 20s
          done

  windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and vet for Windows
        env:
          GOOS: windows
        run: |
          go build ./...
          go vet ./...

  agent-windows:
    name: Agent tests and MSI (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Agent tests
        run: go test -count=1 ./internal/agent/...
      - name: WiX 5.0.2
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build the MSI
        shell: pwsh
        run: .\packaging\windows\build-msi.ps1 -Version 0.0.0
