{{template "app" .}}
{{define "content"}}
<div class="mapview" id="mapview" data-map="{{.Data.M.ID}}" data-edit="{{if .Data.Edit}}1{{end}}">
  <div class="maptools">
    <a class="back" href="/maps">{{.T "Maps"}}</a>
    <h1>{{.Data.M.Name}}</h1>
    <span class="spacer"></span>
    <span class="mapsave muted small" data-save hidden></span>
    {{if .User.CanWrite}}<button type="button" class="btn secondary sm" data-act="discard" hidden>{{.T "Cancel"}}</button>
    <button type="button" class="btn primary sm" data-act="save" hidden disabled>{{.T "Save"}}</button>{{end}}
    <div class="mapbtns" data-edit-only hidden>
      <button type="button" class="btn secondary sm" data-act="add-device">{{template "icon" "plus"}}<span>{{.T "Add device"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="add-item">{{template "icon" "package"}}<span>{{.T "Add item"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="add-rack">{{template "icon" "rack"}}<span>{{.T "Add rack"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="connect">{{template "icon" "link"}}<span>{{.T "Connect"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="suggest">{{template "icon" "network"}}<span>{{.T "Suggested links"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="add-submap">{{template "icon" "map"}}<span>{{.T "Add submap"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="add-text">{{template "icon" "text"}}<span>{{.T "Add text"}}</span></button>
      <button type="button" class="btn secondary sm" data-act="background">{{template "icon" "image"}}<span>{{.T "Background"}}</span></button>
      <button type="button" class="btn danger sm" data-act="delete" disabled>{{template "icon" "trash"}}<span>{{.T "Delete"}}</span></button>
    </div>
    <select class="mapvlan" data-vlan hidden aria-label="VLAN"></select>
    <button type="button" class="btn secondary sm" data-act="path" title="{{.T "Show only how two devices are connected"}}">{{template "icon" "route"}}<span>{{.T "Path"}}</span></button>
    <button type="button" class="btn secondary sm" data-act="layers" aria-expanded="false">{{template "icon" "layers"}}<span>{{.T "Layers"}}</span></button>
    <button type="button" class="btn secondary sm" data-act="fullscreen" title="{{.T "Full screen"}}">{{template "icon" "expand"}}</button>
    {{if .User.CanWrite}}<button type="button" class="btn primary sm" data-act="edit">{{template "icon" "edit"}}<span data-edit-label>{{if .Data.Edit}}{{.T "Done"}}{{else}}{{.T "Edit"}}{{end}}</span></button>{{end}}
  </div>
  <div class="mapstage">
    <svg class="mapsvg" role="application" aria-label="{{.Data.M.Name}}"><g class="viewport"><g class="bg"></g><g class="racks"></g><g class="nodes"></g><g class="links"></g><g class="handles"></g></g></svg>
    <div class="mapzoom">
      <button type="button" class="iconbtn" data-act="zoom-in" title="{{.T "Zoom in"}}">{{template "icon" "zoomin"}}</button>
      <button type="button" class="iconbtn" data-act="zoom-out" title="{{.T "Zoom out"}}">{{template "icon" "zoomout"}}</button>
      <button type="button" class="iconbtn" data-act="fit" title="{{.T "Fit to screen"}}">{{template "icon" "expand"}}</button>
    </div>
    <div class="maplayers" data-layers hidden></div>
    <p class="maphint muted small" data-hint hidden></p>
    <aside class="mappanel" data-panel hidden></aside>
    <input type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,.svg" data-upload hidden>
    <noscript><p class="panel">{{.T "The map needs JavaScript."}}</p></noscript>
  </div>
</div>
<script src="/static/map.js?v={{.Asset}}" defer></script>
{{end}}
