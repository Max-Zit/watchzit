{{template "head" .}}
<body class="kiosk">
<div class="mapview kioskview" id="mapview" data-kiosk="{{.Data.Base}}" data-maps="{{.Data.Maps}}" data-rotate="{{.Data.Rotate}}" data-theme="{{.Data.Theme}}">
  <div class="kioskbar">
    <span class="kbrand">{{template "logo"}}<span>Watch<b>Zit</b></span></span>
    <b class="ktitle" data-kiosk-title></b>
    <span class="kdots" data-kiosk-dots></span>
    <span class="spacer"></span>
    <span class="kclock" data-kiosk-clock></span>
    <button type="button" class="iconbtn" data-act="fullscreen" title="{{.T "Full screen"}}">{{template "icon" "expand"}}</button>
  </div>
  <div class="mapstage">
    <svg class="mapsvg" role="img" aria-label="{{.Data.Name}}"><g class="viewport"><g class="bg"></g><g class="racks"></g><g class="nodes"></g><g class="links"></g><g class="labels"></g></g></svg>
    <aside class="mappanel" data-panel hidden></aside>
    <p class="maphint muted small" data-hint hidden></p>
    <noscript><p class="panel">{{.T "The map needs JavaScript."}}</p></noscript>
  </div>
</div>
<script src="/static/map.js?v={{.Asset}}" defer></script>
</body>
</html>
